[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codexbot"
version = "0.1.0"
description = "Safety-first Bitunix USDT-M futures trading workstation"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "PySide6>=6.8,<7",
  "pyqtgraph>=0.13.7,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8"]

[project.scripts]
codexbot = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*", "backtesting*", "config*", "data*", "engine*", "execution*", "gui*", "indicators*", "models*", "risk*", "services*", "strategies*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

